<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PES 2021 Option Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/jszip.min.js"></script>
<script src="vendor/xlsx.full.min.js"></script>
<script src="js/platform.js"></script>
<style>
.gtable tr.gsp td{padding:0!important;height:auto;border:0}.gtable{table-layout:fixed;width:max-content;min-width:100%}.gtable td{padding:0 2px!important;height:32px;white-space:nowrap}.gtable th{position:sticky;top:0;z-index:2;background:var(--panel)}
.gtable input:not([type=checkbox]),.gtable select{width:100%;height:28px;padding:2px 6px;font-size:13px;border-radius:4px;min-width:0}.gtable td.gch input,.gtable td.gch select{background:rgba(245,180,60,.16);border-color:#e0a33a}
.gtable input.gbad{border-color:var(--bad)}.gtable .gsticky{position:sticky;left:0;z-index:1;background:var(--panel);width:180px;max-width:180px;overflow:hidden;text-overflow:ellipsis}.gtable th.gsticky{z-index:3}
:root{
  /* layout: fixed left rail + scrolling work area; dense tables are the main surface (broadcast-menu look, single dark theme) */
  --bg:#0b111b; --panel:#121b29; --panel2:#192436; --line:#25344b; --text:#e6edf7; --muted:#8a9ab3;
  --accent:#2e9bff; --gold:#f0c24b; --good:#36d29a; --warn:#f2a33a; --bad:#ff5b6b;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--body)}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:224px 1fr;height:100%}
nav.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px;overflow:auto}
.brand{font:800 23px/1 var(--display);letter-spacing:.02em;padding:6px 10px 4px}
.brand b{color:var(--accent)}
.brand-sub{font-size:12px;color:var(--muted);padding:0 10px 14px}
nav.rail a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--muted);text-decoration:none;font-weight:600}
nav.rail a:hover{background:var(--panel2);color:var(--text)}
nav.rail a.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.badge{font-size:12px;background:var(--gold);color:#1b1400;border-radius:10px;padding:0 7px;font-weight:700}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:10px;display:grid;gap:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.dot.ok{background:var(--good)}.dot.busy{background:var(--warn)}.dot.err{background:var(--bad)}
main{overflow:auto;padding:22px 26px 80px}
h1{font:700 32px/1.05 var(--display);margin:0 0 6px;text-wrap:balance;letter-spacing:.01em}
h2{font:700 21px/1.2 var(--display);margin:24px 0 10px;letter-spacing:.02em;text-wrap:balance}
h3{font:600 14px var(--display);margin:0 0 8px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 18px;max-width:72ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.spacer{flex:1}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.card.hl{border-color:var(--accent)}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .n{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums}
.tile .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.tile.warn{box-shadow:inset 3px 0 0 var(--gold)}
button{font:600 14px var(--body);background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#03101e}
button.primary:hover{filter:brightness(1.1)}
button.gold{background:var(--gold);border-color:var(--gold);color:#1b1400}
button.danger{color:var(--bad)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--text);border-color:var(--line)}
button:disabled{opacity:.45;cursor:not-allowed}
.is-busy{pointer-events:none;opacity:.75;position:relative}button.is-busy::after{content:"";display:inline-block;width:.85em;height:.85em;margin-left:.45em;vertical-align:-1px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:bspin .7s linear infinite}
@keyframes bspin{to{transform:rotate(360deg)}}body.working{cursor:progress}
button.sm{padding:3px 8px;font-size:13px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;background:#0d1522;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=color]{padding:2px;width:42px;height:32px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input[type=range]{accent-color:var(--accent)}
textarea{width:100%;min-height:80px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
label.f > input,label.f > select,label.f > textarea{font-size:15px;text-transform:none;letter-spacing:0;color:var(--text);font-weight:400}
label.c{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:700 11.5px var(--body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
th.s{cursor:pointer}th.s:hover{color:var(--text)}
td{padding:6px 8px;border-bottom:1px solid #1b273c;vertical-align:middle}
td.num,th.num{text-align:right}
tr.click:hover td{background:var(--panel2);cursor:pointer}
.tw{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stat{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:1px 5px;font-weight:700;font-variant-numeric:tabular-nums}
.s90{background:#0f3a4b;color:#62d8ff}.s80{background:#0f3a2a;color:#4fe3a5}.s70{background:#33361a;color:#e0e46c}.s60{background:#3d2e14;color:#f5b04a}.s0{background:#3d1a20;color:#ff8792}
.pos{display:inline-block;min-width:38px;text-align:center;font:700 12px var(--body);border-radius:4px;padding:2px 4px;color:#fff}
.pGK{background:#b8860b}.pDEF{background:#1f6fd1}.pMID{background:#1d9a5a}.pATT{background:#c8364a}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:2px 9px;font-size:13px;background:var(--panel2);margin:2px}
.chip.on{border-color:var(--accent);background:#0f2a47}
.tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:2px 6px}
.t-add{background:#0f3a2a;color:var(--good)}.t-rem{background:#3d1a20;color:var(--bad)}.t-upd{background:#0f2a47;color:#7cc0ff}.t-mov{background:#3d3214;color:var(--gold)}
.up{color:var(--good)}.down{color:var(--bad)}
.muted{color:var(--muted)}.small{font-size:13px}
.warnbox{border:1px solid #5a4417;background:#2a2110;color:#f4d58d;border-radius:8px;padding:10px 12px;font-size:14px}
.infobox{border:1px solid #1f4369;background:#0f1f33;color:#bcd9ff;border-radius:8px;padding:10px 12px;font-size:14px}
.thumb{width:48px;height:48px;object-fit:contain;background:repeating-conic-gradient(#1b2638 0 25%,#141d2c 0 50%) 0 0/12px 12px;border-radius:6px;border:1px solid var(--line);flex:none}
.thumb.lg{width:96px;height:96px}
.thumb.empty{display:inline-grid;place-items:center;color:var(--muted);font-size:11px}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.25);vertical-align:-2px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:12px 0 16px;flex-wrap:wrap}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;border-radius:0;color:var(--muted);padding:8px 12px}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.split{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.list{display:flex;flex-direction:column;gap:2px;max-height:72vh;overflow:auto}
.li{display:flex;gap:10px;align-items:center;padding:7px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.li:hover{background:var(--panel2)}.li.on{background:var(--panel2);border-color:var(--accent)}
.li .nm{font-weight:600;line-height:1.2}.li .meta{font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;counter-reset:s}
.step{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 12px 12px 46px;position:relative;font-size:14px}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:12px;top:10px;font:700 24px var(--display);color:var(--accent)}
#modal{position:fixed;inset:0;background:rgba(3,7,13,.72);display:grid;place-items:center;z-index:50;padding:16px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:92vh;overflow:auto;padding:18px}
.mbox.wide{width:min(1060px,100%)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h2{margin:0}
#toast{position:fixed;right:18px;bottom:18px;display:grid;gap:8px;z-index:60}
.toast{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);padding:10px 14px;border-radius:6px;max-width:380px;font-size:14px}
.toast.err{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--good)}
.attr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:6px 18px}
.attr{display:grid;grid-template-columns:1fr 110px 46px;gap:8px;align-items:center;font-size:14px}
.attr input[type=number]{width:46px;padding:3px 4px;text-align:center}
.posgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}
.posgrid label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.log{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0a1019;border:1px solid var(--line);border-radius:8px;padding:10px;max-height:260px;overflow:auto;white-space:pre-wrap}
.bar{height:6px;background:#1b273c;border-radius:4px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.aiprog{display:grid;gap:5px;min-width:220px;flex:1}
.aiprog .bar{height:9px;border-radius:5px;background:#1b273c}
.aiprog .bar > i{background:linear-gradient(90deg,var(--accent),#63b8ff);border-radius:5px;transition:width .4s ease}
.aiprog.done .bar > i{background:var(--good)}.aiprog.stopped .bar > i{background:var(--warn)}
.aiprog.indet .bar > i{width:35%!important;animation:indet 1.2s ease-in-out infinite}
@keyframes indet{0%{margin-left:-35%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.aiprog.indet .bar > i{animation:none;width:100%!important;opacity:.6}}
.aiprog-t{font-size:12.5px;color:var(--muted);display:flex;gap:8px;justify-content:space-between;white-space:nowrap;overflow:hidden}
.aiprog-t b{color:var(--text);font-variant-numeric:tabular-nums}
.aiprog-t span{overflow:hidden;text-overflow:ellipsis}
#rail-prog .aiprog{min-width:0;margin-bottom:6px}#rail-prog .aiprog-t{flex-direction:column;gap:1px;white-space:normal}#rail-prog .aiprog-t span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.h2h{display:grid;grid-template-columns:44px 1fr 150px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.h2h .l{height:8px;background:#1b273c;border-radius:4px;overflow:hidden;display:flex;justify-content:flex-end}
.h2h .r{height:8px;background:#1b273c;border-radius:4px;overflow:hidden}
.h2h .l i{background:var(--accent);display:block}.h2h .r i{background:var(--gold);display:block}
.canvas-wrap{background:repeating-conic-gradient(#1b2638 0 25%,#141d2c 0 50%) 0 0/16px 16px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;padding:12px}
.canvas-wrap canvas{max-width:100%;height:auto}
.tree details{border-bottom:1px solid #1b273c;padding:6px 0}
.tree summary{cursor:pointer;display:flex;gap:8px;align-items:center}
.tree .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 12px;padding:8px 0 4px 28px}
.fld{display:grid;grid-template-columns:22px 170px 1fr 20px 1fr;gap:6px;align-items:center;font-size:13.5px;padding:2px 0}
.fld input[type=text],.fld input[type=number]{padding:2px 6px;width:100%}
.rev-item{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.rev-item.off{opacity:.5}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  nav.rail{flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .brand,.brand-sub,.rail-foot{display:none}
  .split{grid-template-columns:1fr}
  main{padding:16px}
  .fld{grid-template-columns:22px 1fr;}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:tin .2s ease-out}@keyframes tin{from{transform:translateY(8px);opacity:.3}}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail">
    <div class="brand">PES 2021 <b>Option Studio</b></div>
    <div class="brand-sub">Data, logos &amp; kits for PS4 / PS5 via USB</div>
    <a href="#overview" data-v="overview">Overview</a>
    <a href="#competitions" data-v="competitions">Competitions</a>
    <a href="#teams" data-v="teams">Teams &amp; squads</a>
    <a href="#players" data-v="players">Players</a>
    <a href="#studio" data-v="studio">Logos &amp; kits</a>
    <a href="#ai" data-v="ai">Claude update</a>
    <a href="#import" data-v="import">Import files</a>
    <a href="#review" data-v="review">Review changes <span class="badge" id="nb-review" hidden>0</span></a>
    <a href="#health" data-v="health">Health check <span class="badge" id="nb-health" hidden>0</span></a>
    <a href="#compare" data-v="compare">Compare &amp; versions</a>
    <a href="#export" data-v="export">Export to USB</a>
    <a href="#settings" data-v="settings">Settings</a>
    <div class="rail-foot">
      <div id="rail-prog"></div>
      <div id="st-mode"><span class="dot"></span>Connecting storage…</div>
      <div id="st-save" class="muted"></div>
      <div id="st-account"></div>
    </div>
  </nav>
  <main id="main"><p class="muted">Loading your project…</p></main>
</div>
<div id="modal" hidden></div>
<div id="toast" aria-live="polite"></div>

<script>
"use strict";
/* ================= Constants: PES 2021 data model ================= */
const ATTRS=[
 ['offAw','Offensive Awareness','att'],['ballCtl','Ball Control','att'],['drib','Dribbling','att'],['tight','Tight Possession','att'],
 ['lowPass','Low Pass','att'],['loftPass','Lofted Pass','att'],['finish','Finishing','att'],['heading','Heading','att'],
 ['placeKick','Place Kicking','att'],['curl','Curl','att'],
 ['speed','Speed','phy'],['accel','Acceleration','phy'],['kickPow','Kicking Power','phy'],['jump','Jump','phy'],
 ['contact','Physical Contact','phy'],['balance','Balance','phy'],['stamina','Stamina','phy'],
 ['defAw','Defensive Awareness','def'],['ballWin','Ball Winning','def'],['aggr','Aggression','def'],
 ['gkAw','GK Awareness','gk'],['gkCatch','GK Catching','gk'],['gkClear','GK Clearing','gk'],['gkReflex','GK Reflexes','gk'],['gkReach','GK Reach','gk']];
const ATTR_KEYS=ATTRS.map(a=>a[0]);
const GROUPS={att:'Attacking',phy:'Physical',def:'Defending',gk:'Goalkeeping'};
const POS=['GK','CB','LB','RB','DMF','CMF','LMF','RMF','AMF','LWF','RWF','SS','CF'];
const POS_GROUP=p=>p==='GK'?'GK':['CB','LB','RB'].includes(p)?'DEF':['DMF','CMF','LMF','RMF','AMF'].includes(p)?'MID':'ATT';
const STYLES=['None','Goal Poacher','Dummy Runner','Fox in the Box','Prolific Winger','Classic No. 10','Hole Player','Box-to-Box','Anchor Man','The Destroyer','Extra Frontman','Offensive Full-back','Defensive Full-back','Target Man','Creative Playmaker','Build Up','Offensive Goalkeeper','Defensive Goalkeeper','Roaming Flank','Cross Specialist','Orchestrator','Full-back Finisher'];
const SKILLS=['Scissors Feint','Double Touch','Flip Flap','Marseille Turn','Sombrero','Cross Over Turn','Cut Behind & Turn','Scotch Move','Step On Skill Control','Heading','Long Range Drive','Chip Shot Control','Long Range Shooting','Knuckle Shot','Dipping Shot','Rising Shot','Acrobatic Finishing','Heel Trick','First-time Shot','One-touch Pass','Through Passing','Weighted Pass','Pinpoint Crossing','Outside Curler','Rabona','No Look Pass','Low Lofted Pass','GK Low Punt','GK High Punt','Long Throw','GK Long Throw','Penalty Specialist','GK Penalty Saver','Gamesmanship','Man Marking','Track Back','Interception','Acrobatic Clear','Captaincy','Super-sub','Fighting Spirit'];
const COM=['Trickster','Mazing Run','Speeding Bullet','Incisive Run','Long Ball Expert','Early Cross','Long Ranger'];
const PLAYSTYLES=['Possession Game','Quick Counter','Long Ball Counter','Out Wide','Long Ball'];
const FORMATIONS=['4-3-3','4-2-3-1','4-4-2','4-1-2-3','4-3-2-1','4-1-4-1','4-4-1-1','4-2-2-2','4-3-1-2','3-4-3','3-5-2','3-4-2-1','3-4-1-2','5-3-2','5-4-1'];
const KIT_SLOTS=['1st','2nd','3rd','GK 1st','GK 2nd'];
const COLLARS=['Crew neck','V-neck','Polo collar','Henley','Grandad','Wrap-over'];
const IMG_KINDS={
  emblem:{label:'Team emblem',game:'Team Emblem',sq:true},
  comp:{label:'Competition emblem',game:'Competition Emblem',sq:true},
  kit:{label:'Kit texture',game:'Strip',sq:true},
  manager:{label:'Manager photo',game:'Manager photo',sq:true},
  sponsor:{label:'Sponsor / logo art',game:'Reference only',sq:false},
  kitref:{label:'Kit preview',game:'Reference only',sq:false}};
const COMP_TEMPLATES=[
 ['Premier League','England','League'],['EFL Championship','England','League'],['LaLiga','Spain','League'],['LaLiga Hypermotion','Spain','League'],
 ['Serie A','Italy','League'],['Serie B','Italy','League'],['Bundesliga','Germany','League'],['Ligue 1','France','League'],['Ligue 2','France','League'],
 ['Eredivisie','Netherlands','League'],['Liga Portugal','Portugal','League'],['Süper Lig','Türkiye','League'],['Scottish Premiership','Scotland','League'],
 ['Belgian Pro League','Belgium','League'],['Brasileirão Série A','Brazil','League'],['Liga Profesional','Argentina','League'],['Saudi Pro League','Saudi Arabia','League'],
 ['ADNOC Pro League','UAE','League'],['Major League Soccer','USA','League'],['UEFA Champions League','Europe','Cup'],['UEFA Europa League','Europe','Cup'],
 ['AFC Champions League Elite','Asia','Cup'],['National teams','International','Cup']];
const W={ // position weights used for the estimated overall
 GK:{gkAw:3,gkReflex:3,gkCatch:2,gkReach:2,gkClear:1,jump:.5},
 CB:{defAw:3,ballWin:3,heading:2,contact:2,jump:1.5,aggr:1,speed:1,stamina:.5},
 LB:{defAw:2,ballWin:2,speed:2,accel:1.5,stamina:2,lowPass:1,loftPass:1,drib:.5},
 RB:{defAw:2,ballWin:2,speed:2,accel:1.5,stamina:2,lowPass:1,loftPass:1,drib:.5},
 DMF:{defAw:3,ballWin:3,lowPass:2,loftPass:1,aggr:1,contact:1.5,stamina:1.5,ballCtl:1},
 CMF:{lowPass:3,loftPass:2,ballCtl:2,stamina:1.5,defAw:1,ballWin:1,offAw:1,tight:1},
 LMF:{speed:1.5,accel:1.5,drib:2,ballCtl:1.5,lowPass:1.5,loftPass:1.5,stamina:1.5,offAw:1},
 RMF:{speed:1.5,accel:1.5,drib:2,ballCtl:1.5,lowPass:1.5,loftPass:1.5,stamina:1.5,offAw:1},
 AMF:{lowPass:2.5,ballCtl:2,drib:2,offAw:2,tight:1.5,finish:1,loftPass:1,balance:1},

const Store={
  mode:'memory',proj:null,assets:null,idb:null,urls:new Map(),mem:new Map(),memBlobs:new Map(),
  timers:new Map(),latest:new Map(),inflight:new Set(),again:new Set(),errors:0,
  async init(){
    const C=window.claude;
    if(C&&C.use){
      try{
        const [db,user,assets]=await Promise.all([C.use('db'),C.use('user'),C.use('assets')]);
        const id=user&&user.id?await user.id():null;
        if(db&&id&&assets){this.proj=db.doc('data/users/'+id+'/pes2021');this.assets=assets;this.mode='cloud';return this.mode}
      }catch(e){console.warn('cloud storage unavailable',e)}
    }
    try{this.idb=await new Promise((res,rej)=>{const r=indexedDB.open('pes21-option-studio',1);r.onupgradeneeded=()=>{r.result.createObjectStore('docs');r.result.createObjectStore('blobs')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});this.mode='local'}
    catch(e){this.mode='memory'}

  },
  _tx(store,mode,fn){return new Promise((res,rej)=>{const tx=this.idb.transaction(store,mode);const r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})},
  async list(col){
    if(this.mode==='cloud'){const snap=await withTimeout(this.proj.collection(col).get(),15000);return snap.docs.map(d=>clone(d.data()))}
    if(this.mode==='local')return (await this._tx('docs','readonly',s=>s.getAll(IDBKeyRange.bound(col+'/',col+'/￿'))))||[];
    return [...this.mem.entries()].filter(([k])=>k.startsWith(col+'/')).map(([,v])=>clone(v));
  },
  put(col,obj){const key=col+'/'+obj.id;this.latest.set(key,clone(obj));clearTimeout(this.timers.get(key));this.timers.set(key,setTimeout(()=>this._flush(key,col,obj.id),500));status()},
  async _flush(key,col,id){
    this.timers.delete(key);
    if(this.inflight.has(key)){this.again.add(key);return}
    const obj=this.latest.get(key);if(!obj){status();return}
    this.inflight.add(key);status();
    try{
      if(this.mode==='cloud'){const s=JSON.stringify(obj);if(s.length>250000)throw new Error('This record is too large to save to the cloud ('+kb(s.length)+'). Split the squad or remove notes.');await this.proj.collection(col).doc(id).set(obj)}
      else if(this.mode==='local')await this._tx('docs','readwrite',s=>s.put(obj,key));
      else this.mem.set(key,obj);
      if(this.latest.get(key)===obj)this.latest.delete(key);
    }catch(e){this.errors++;toast('Could not save: '+(e.message||e.code||e),'err')}
    finally{this.inflight.delete(key);if(this.again.delete(key))this._flush(key,col,id);status()}
  },
  async del(col,id){const key=col+'/'+id;clearTimeout(this.timers.get(key));this.timers.delete(key);this.latest.delete(key);
    try{if(this.mode==='cloud')await this.proj.collection(col).doc(id).delete();else if(this.mode==='local')await this._tx('docs','readwrite',s=>s.delete(key));else this.mem.delete(key)}
    catch(e){toast('Could not delete: '+(e.message||e.code),'err')}},
  pending(){return this.timers.size+this.inflight.size+Object.values(S.snaps||{}).filter(s=>s.uploading).length},
  async putBlob(blob,type){
    if(this.mode==='cloud'){const r=await this.assets.upload(blob,{type:type||blob.type||'image/png'});const ref='a:'+r.id;this.urls.set(ref,r.url);return ref}
    const id=uid();const ref='l:'+id;

    this.urls.set(ref,URL.createObjectURL(blob));return ref;
  },
  url(ref){if(!ref)return'';if(this.urls.has(ref))return this.urls.get(ref);if(ref.startsWith('a:')){const u='/_blob/'+ref.slice(2);this.urls.set(ref,u);return u}return''},
  async preload(ref){if(!ref||this.urls.has(ref)||!ref.startsWith('l:'))return;const b=await this.getBlob(ref);if(b)this.urls.set(ref,URL.createObjectURL(b))},
  async getBlob(ref){
    if(!ref)return null;
    if(ref.startsWith('a:')){const r=await fetch('/_blob/'+ref.slice(2));if(!r.ok)throw new Error('Image file missing ('+r.status+')');return await r.blob()}
    const id=ref.slice(2);if(this.mode==='local')return await this._tx('blobs','readonly',s=>s.get(id));return this.memBlobs.get(id)||null;
  },
  async delBlob(ref){try{if(!ref)return;if(ref.startsWith('a:'))await this.assets.delete(ref.slice(2));else if(this.mode==='local')await this._tx('blobs','readwrite',s=>s.delete(ref.slice(2)));this.urls.delete(ref)}catch(e){console.warn(e)}}
};

  const ca=A.comps||{},cb=B.comps||{},ta=A.teams||{},tb=B.teams||{};
  new Set([...Object.keys(ca),...Object.keys(cb)]).forEach(id=>{const a=ca[id],b=cb[id];
    if(!a)res.comps.push({type:'added',id,obj:b});else if(!b)res.comps.push({type:'removed',id,obj:a});
    else{const f=diffObj(a,b,COMP_PATHS);if(f.length)res.comps.push({type:'changed',id,obj:b,fields:f})}});
  new Set([...Object.keys(ta),...Object.keys(tb)]).forEach(id=>{const a=ta[id],b=tb[id];
    if(!a)res.teams.push({type:'added',id,obj:b});else if(!b)res.teams.push({type:'removed',id,obj:a});
    else{const f=diffObj(a,b,TEAM_PATHS);if(f.length)res.teams.push({type:'changed',id,obj:b,fields:f})}});
  const ia=new Map(),ib=new Map();
  Object.values(ta).forEach(t=>(t.players||[]).forEach(p=>ia.set(p.id,{p,t})));
  Object.values(tb).forEach(t=>(t.players||[]).forEach(p=>ib.set(p.id,{p,t})));
  new Set([...ia.keys(),...ib.keys()]).forEach(id=>{const a=ia.get(id),b=ib.get(id);
    if(!a)res.players.push({type:'added',id,p:b.p,tB:b.t});
    else if(!b)res.players.push({type:'removed',id,p:a.p,tA:a.t});
    else{const f=diffObj(a.p,b.p,PLAYER_PATHS);const moved=a.t.id!==b.t.id;

}

// every action: async ones show a busy state at once, run once at a time, and ignore repeat clicks until done
const BUSY=new Set(),EXCL=new Map();const nextPaint=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,0)));
const actKey=el=>el.dataset.act+'|'+Object.entries(el.dataset).filter(([k])=>k!=='act').map(([k,v])=>k+'='+v).join('&');
function markBusy(){$$('[data-act]').forEach(el=>{const on=BUSY.has(actKey(el));el.classList.toggle('is-busy',on);if(on){el.setAttribute('aria-busy','true')}else el.removeAttribute('aria-busy')});document.body.classList.toggle('working',BUSY.size>0)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(!f)return;e.preventDefault();
  const key=actKey(el);if(BUSY.has(key))return;
  // while one action is working, other working actions wait their turn (dialogs, Stop and Pause still respond)
  const free=el.closest('#modal')||/^(aiCancel|close|askYes|askNo|askInput|qDel)$/.test(el.dataset.act);
  if(!free&&[...EXCL.values()].some(t=>Date.now()-t<60000)&&(f.constructor&&f.constructor.name==='AsyncFunction')){toast('Still working on the last step…','');return}
  if(f.constructor&&f.constructor.name==='AsyncFunction'){BUSY.add(key);if(!free)EXCL.set(key,Date.now());markBusy();
    (async()=>{try{await nextPaint();await f(el,e)}catch(err){console.error(err);toast('Something went wrong: '+(err.message||err),'err')}finally{BUSY.delete(key);EXCL.delete(key);markBusy()}})();return}
  let r;try{r=f(el,e)}catch(err){console.error(err);toast('Something went wrong: '+(err.message||err),'err');return}
  if(r&&typeof r.then==='function'){BUSY.add(key);markBusy();Promise.resolve(r).catch(err=>{console.error(err);toast('Something went wrong: '+(err.message||err),'err')}).finally(()=>{BUSY.delete(key);markBusy()})}});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dlg-in'){e.preventDefault();ACT.askInput();return}if(e.key==='Escape'&&!$('#modal').hidden){if(S.ui.askRes){const r=S.ui.askRes;S.ui.askRes=null;r(false)}closeModal()}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){if(S.ui.askRes){const r=S.ui.askRes;S.ui.askRes=null;r(false)}closeModal()}});
ACT.askYes=()=>{const r=S.ui.askRes;S.ui.askRes=null;closeModal();r&&r(true)};
ACT.askNo=()=>{const r=S.ui.askRes;S.ui.askRes=null;closeModal();r&&r(false)};
ACT.askInput=()=>{const v=$('#dlg-in').value;const r=S.ui.askRes;S.ui.askRes=null;closeModal();r&&r(v)};

/* ================= Snapshots ================= */
async function takeSnapshot(name,quiet){
  const data={teams:S.teams,comps:S.comps,images:S.images,settings:{season:S.settings.season}};
  const json=JSON.stringify(data);
  const sn={id:uid(),name:name||'Snapshot '+fmtDate(Date.now()),createdAt:Date.now(),ref:null,uploading:true,auto:!!quiet,counts:{comps:Object.keys(S.comps).length,teams:Object.keys(S.teams).length,players:allPlayers().length},size:json.length};
  S.snaps[sn.id]=sn;S.snapData[sn.id]=JSON.parse(json);Store.put('snaps',sn);snapUpload(sn,json);snapPrune();
  if(!quiet)toast('Snapshot saved: '+sn.name,'ok');return sn;
}
// snapshot files upload in the background, one at a time, so the button that asked for one isn't held up
let SNAPQ=Promise.resolve();
function snapUpload(sn,json){SNAPQ=SNAPQ.then(async()=>{try{const ref=await withTimeout(Store.putBlob(new Blob([json],{type:'text/plain'}),'text/plain'),180000);
    if(!S.snaps[sn.id]){Store.delBlob(ref);return}sn.ref=ref;delete sn.uploading;Store.put('snaps',sn)}
  catch(e){sn.uploading=false;sn.failed=true;Store.put('snaps',sn);toast('Snapshot "'+sn.name+'" is kept only until you close this page: '+(e.message||e),'err')}finally{status()}})}
function snapPrune(){const auto=Object.values(S.snaps).filter(s=>s.auto&&s.id!==S.settings.baseline).sort((a,b)=>b.createdAt-a.createdAt);
  auto.slice(20).forEach(s=>{if(s.uploading)return;delete S.snaps[s.id];delete S.snapData[s.id];Store.del('snaps',s.id);if(s.ref)Store.delBlob(s.ref)})}
async function loadSnap(id){
  if(S.snapData[id])return S.snapData[id];const sn=S.snaps[id];if(!sn)return null;if(!sn.ref)throw new Error(sn.uploading?'This snapshot was still saving when the page closed and is incomplete':'This snapshot could not be saved');
  const b=await Store.getBlob(sn.ref);if(!b)throw new Error('Snapshot data missing');
  const d=JSON.parse(await b.text());S.snapData[id]=d;return d;
}
function dataFor(key){ // 'current' | 'baseline' | snapId -> data or null (loads async and rerenders)
  if(key==='current')return currentData();
  const id=key==='baseline'?S.settings.baseline:key;if(!id||!S.snaps[id])return null;
  if(S.snapData[id])return S.snapData[id];
  if(!S.ui['loading_'+id]){S.ui['loading_'+id]=true;loadSnap(id).then(()=>rerender()).catch(e=>toast(e.message,'err'))}
  return undefined;
}

/* ================= Image library & tools ================= */
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('Could not read that image'));i.src=src})}
function canvasBlob(c){return new Promise(r=>c.toBlob(r,'image/png'))}
async function fitToCanvas(img,w,h,mode='contain',bg=null){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(bg){x.fillStyle=bg;x.fillRect(0,0,w,h)}
  const iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;const s=mode==='cover'?Math.max(w/iw,h/ih):mode==='stretch'?null:Math.min(w/iw,h/ih);
  x.imageSmoothingQuality='high';if(s===null)x.drawImage(img,0,0,w,h);else{const dw=iw*s,dh=ih*s;x.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh)}return c}

function emblemPath(x,shape,s){const p=new Path2D();const c=s/2;
  if(shape==='round'){p.arc(c,c,s*0.46,0,Math.PI*2)}
  else if(shape==='diamond'){p.moveTo(c,s*.04);p.lineTo(s*.94,c);p.lineTo(c,s*.96);p.lineTo(s*.06,c);p.closePath()}
  else if(shape==='classic'){p.moveTo(s*.12,s*.08);p.lineTo(s*.88,s*.08);p.lineTo(s*.88,s*.5);p.bezierCurveTo(s*.88,s*.78,s*.62,s*.9,c,s*.97);p.bezierCurveTo(s*.38,s*.9,s*.12,s*.78,s*.12,s*.5);p.closePath()}
  else if(shape==='modern'){p.moveTo(s*.16,s*.06);p.lineTo(s*.84,s*.06);p.quadraticCurveTo(s*.92,s*.06,s*.92,s*.16);p.lineTo(s*.92,s*.62);p.quadraticCurveTo(s*.9,s*.84,c,s*.96);p.quadraticCurveTo(s*.1,s*.84,s*.08,s*.62);p.lineTo(s*.08,s*.16);p.quadraticCurveTo(s*.08,s*.06,s*.16,s*.06);p.closePath()}
  else{p.moveTo(c,s*.04);p.quadraticCurveTo(s*.72,s*.12,s*.92,s*.1);p.lineTo(s*.9,s*.52);p.quadraticCurveTo(s*.86,s*.8,c,s*.97);p.quadraticCurveTo(s*.14,s*.8,s*.1,s*.52);p.lineTo(s*.08,s*.1);p.quadraticCurveTo(s*.28,s*.12,c,s*.04);p.closePath()}
  return p}
function drawEmblem(x,o,s){
  x.clearRect(0,0,s,s);const path=emblemPath(x,o.shape,s);
  x.save();x.clip(path);x.fillStyle=o.c1;x.fillRect(0,0,s,s);x.fillStyle=o.c2;
  const n=clamp(o.stripes||5,2,11);
  if(o.div==='stripes'){const w=s/(n*2-1);for(let i=1;i<n*2-1;i+=2)x.fillRect(i*w,0,w,s)}
  else if(o.div==='hoops'){const h=s/(n*2-1);for(let i=1;i<n*2-1;i+=2)x.fillRect(0,i*h,s,h)}
  else if(o.div==='halves')x.fillRect(s/2,0,s/2,s);
  else if(o.div==='quarters'){x.fillRect(s/2,0,s/2,s/2);x.fillRect(0,s/2,s/2,s/2)}
  else if(o.div==='sash'){x.beginPath();x.moveTo(0,s*.15);x.lineTo(s*.2,0);x.lineTo(s,s*.8);x.lineTo(s*.8,s);x.closePath();x.fill()}
  else if(o.div==='chevron'){x.beginPath();x.moveTo(0,s*.35);x.lineTo(s/2,s*.62);x.lineTo(s,s*.35);x.lineTo(s,s*.5);x.lineTo(s/2,s*.77);x.lineTo(0,s*.5);x.closePath();x.fill()}
  // centre panel for text
  if(o.text){x.fillStyle=o.ring;x.globalAlpha=.85;const r=s*.22;x.beginPath();x.arc(s/2,s*.5,r,0,Math.PI*2);x.fill();x.globalAlpha=1;
    x.strokeStyle=o.c3;x.lineWidth=s*.018;x.stroke();
    x.fillStyle=o.c3;x.textAlign='center';x.textBaseline='middle';const len=o.text.length;x.font=`800 ${s*(len>3?.13:len>2?.16:.2)}px "Barlow Condensed", "Arial Narrow", sans-serif`;x.fillText(o.text.toUpperCase(),s/2,s*.505)}
  x.restore();
  x.lineWidth=s*.035;x.strokeStyle=o.ring;x.stroke(path);x.lineWidth=s*.012;x.strokeStyle=o.c3;x.save();x.translate(s*.035,s*.035);x.scale(.93,.93);x.stroke(emblemPath(x,o.shape,s));x.restore();
  if(o.year){x.fillStyle=o.c3;x.font=`700 ${s*.075}px "Barlow Condensed", sans-serif`;x.textAlign='center';x.fillText(o.year,s/2,s*.8)}
  for(let i=0;i<(o.stars||0);i++){const cx=s/2+(i-(o.stars-1)/2)*s*.08,cy=s*(o.shape==='round'?.18:.15);star(x,cx,cy,s*.03,o.c3)}
}
function star(x,cx,cy,r,col){x.beginPath();for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fillStyle=col;x.fill()}

function shirtPath(cx,y,s){const p=new Path2D();p.moveTo(cx-38*s,y);p.quadraticCurveTo(cx,y+24*s,cx+38*s,y);p.lineTo(cx+96*s,y+14*s);p.lineTo(cx+146*s,y+78*s);p.lineTo(cx+112*s,y+106*s);p.lineTo(cx+90*s,y+82*s);p.lineTo(cx+90*s,y+262*s);
  p.quadraticCurveTo(cx,y+272*s,cx-90*s,y+262*s);p.lineTo(cx-90*s,y+82*s);p.lineTo(cx-112*s,y+106*s);p.lineTo(cx-146*s,y+78*s);p.lineTo(cx-96*s,y+14*s);p.closePath();return p}
function fillPattern(x,o,X,Y,Wd,H){

  if(o.pattern==='stripes'){const w=Wd/(n*2-1);for(let i=1;i<n*2-1;i+=2)x.fillRect(X+i*w,Y,w,H)}
  else if(o.pattern==='pinstripes'){for(let i=0;i<n*3;i++)x.fillRect(X+(i+.5)*Wd/(n*3),Y,2,H)}
  else if(o.pattern==='hoops'){const h=H/(n*2-1);for(let i=1;i<n*2-1;i+=2)x.fillRect(X,Y+i*h,Wd,h)}
  else if(o.pattern==='halves')x.fillRect(X+Wd/2,Y,Wd/2,H);
  else if(o.pattern==='quarters'){x.fillRect(X+Wd/2,Y,Wd/2,H*.4);x.fillRect(X,Y+H*.4,Wd/2,H*.6)}
  else if(o.pattern==='sash'){x.beginPath();x.moveTo(X+Wd*.15,Y);x.lineTo(X+Wd*.45,Y);x.lineTo(X+Wd*.85,Y+H);x.lineTo(X+Wd*.55,Y+H);x.closePath();x.fill()}
  else if(o.pattern==='chevron'){x.beginPath();x.moveTo(X,Y+H*.18);x.lineTo(X+Wd/2,Y+H*.42);x.lineTo(X+Wd,Y+H*.18);x.lineTo(X+Wd,Y+H*.3);x.lineTo(X+Wd/2,Y+H*.54);x.lineTo(X,Y+H*.3);x.closePath();x.fill()}

    x.beginPath();x.moveTo(cx-146,y+78);x.lineTo(cx-112,y+106);x.lineTo(cx-104,y+98);x.lineTo(cx-138,y+70);x.closePath();x.fill();x.restore();

      if(emblemImg)x.drawImage(emblemImg,cx-72,y+62,36,36);else{x.fillStyle=o.trim;x.beginPath();x.arc(cx-54,y+80,14,0,Math.PI*2);x.fill()}
      x.fillStyle=o.numberColor;x.font='700 26px "Barlow Condensed", sans-serif';x.fillText(o.number,cx+54,y+82);

    x.fillStyle=o.trim;x.fillRect(cx-86,sy,172,8);
    if(side===0){x.fillStyle=o.numberColor;x.font='700 18px "Barlow Condensed", sans-serif';x.fillText(o.number,cx-60,sy+80)}

    [cx-50,cx+50].forEach(sx=>{x.fillStyle=o.socks;x.fillRect(sx-16,sy+124,32,74);x.fillStyle=o.trim;x.fillRect(sx-16,sy+124,32,8);x.strokeStyle='rgba(0,0,0,.4)';x.strokeRect(sx-16,sy+124,32,74)});
    x.fillStyle='rgba(230,237,247,.6)';x.font='600 13px Barlow, sans-serif';x.fillText(label,cx,Hc-14);
  });
}

  const byName=new Map();(inc.players||[]).forEach(p=>byName.set(norm(p.name),p));
  const lastName=new Map();(inc.players||[]).forEach(p=>{const ln=norm(p.name).split(' ').pop();if(!lastName.has(ln))lastName.set(ln,p);else lastName.set(ln,null)});
  const others=new Map();if(parts.has('transfers'))Object.values(S.teams).forEach(t=>{if(t.id!==base.id)(t.players||[]).forEach(p=>others.set(norm(p.name),p))});
  const out=[];const matched=new Set();const needStats=[];
  for(const rp of roster){
    const n=norm(rp.name);let ex=byName.get(n)||(lastName.get(n.split(' ').pop())||null);
    if(ex&&matched.has(ex.id))ex=null;
    let p;
    if(ex){p=clone(ex);matched.add(ex.id)}
    else if(others.has(n)){p=clone(others.get(n));aiLog('  Transfer found: '+p.name)}
    else{if(!parts.has('roster'))continue;p=newPlayer({name:rp.name,pos:rp.pos});p._new=true}
    if(parts.has('bio')||p._new){Object.assign(p,{shirtName:rp.shirtName||p.shirtName,number:rp.number??p.number,age:rp.age||p.age,nat:rp.nat||p.nat,height:rp.height||p.height,weight:rp.weight||p.weight,foot:rp.foot||p.foot})}
    if((parts.has('styles')||p._new)&&POS.includes(rp.pos))p.pos=rp.pos;

  if(parts.has('roster'))inc.players=out;else{const map=new Map(out.map(p=>[p.id,p]));inc.players=(inc.players||[]).map(p=>map.get(p.id)||p)}
  for(let i=0;i<needStats.length;i+=6){
    if(signal.aborted)throw new DOMException('Stopped','AbortError');
    const chunk=needStats.slice(i,i+6);aiLog('  Ratings '+(i+1)+'–'+(i+chunk.length)+' of '+needStats.length+'…');

    try{const res=await aiJSON(statsPrompt(list,season),signal);applyStats(chunk,res,parts.has('styles')||true)}catch(e){if(e.name==='AbortError')throw e;aiLog('  Could not rate this group: '+e.message)}
  }
  inc.players.forEach(p=>{delete p._new;normPlayer(p)});
  return inc;
}
function applyStats(chunk,res,withStyles){

function batchFromData(inc,{title,source,removeMissing,teamScope}){
  const items=[];const gIdx=new Map();Object.values(S.teams).forEach(t=>(t.players||[]).forEach(p=>gIdx.set(p.id,{p,t})));
  const gName=new Map();Object.values(S.teams).forEach(t=>(t.players||[]).forEach(p=>{const n=norm(p.name);gName.set(n,gName.has(n)?null:{p,t})}));
  Object.values(inc.comps||{}).forEach(c=>{const ex=S.comps[c.id]||Object.values(S.comps).find(x=>norm(x.name)===norm(c.name));
    if(!ex)items.push({id:uid(),kind:'comp',op:'add',name:c.name,obj:c,accept:true});
    else{const f=diffObj(ex,c,COMP_PATHS).map(x=>Object.assign(x,{accept:true}));if(f.length)items.push({id:uid(),kind:'comp',op:'update',compId:ex.id,name:ex.name,fields:f,accept:true})}});
  Object.values(inc.teams||{}).forEach(t=>{
    const ex=S.teams[t.id]||Object.values(S.teams).find(x=>norm(x.name)===norm(t.name));
    if(!ex){const copy=clone(t);copy.players.forEach(normPlayer);items.push({id:uid(),kind:'team',op:'add',name:t.name,obj:copy,accept:true});return}
    const f=diffObj(ex,t,TEAM_PATHS.filter(k=>k!=='players')).map(x=>Object.assign(x,{accept:true}));
    if(f.length)items.push({id:uid(),kind:'team',op:'update',teamId:ex.id,name:ex.name,fields:f,accept:true});
    const seen=new Set();
    (t.players||[]).forEach(p0=>{const p=normPlayer(clone(p0));
      let cur=gIdx.get(p.id);
      if(!cur){const inTeam=(ex.players||[]).find(x=>norm(x.name)===norm(p.name));if(inTeam)cur={p:inTeam,t:ex};else{const g=gName.get(norm(p.name));if(g)cur=g}}
      if(!cur){items.push({id:uid(),kind:'player',op:'add',teamId:ex.id,name:p.name,obj:p,accept:true});return}
      seen.add(cur.p.id);const target=Object.assign(clone(p),{id:cur.p.id});
      const f=diffObj(cur.p,target,PLAYER_PATHS).map(x=>Object.assign(x,{accept:true}));
      if(cur.t.id!==ex.id)items.push({id:uid(),kind:'player',op:'move',playerId:cur.p.id,fromTeam:cur.t.id,teamId:ex.id,name:cur.p.name,fields:f,accept:true});
      else if(f.length)items.push({id:uid(),kind:'player',op:'update',playerId:cur.p.id,teamId:ex.id,name:cur.p.name,fields:f,accept:true});
    });
    if(removeMissing&&(!teamScope||teamScope.includes(t.id)||teamScope.includes(ex.id)))(ex.players||[]).forEach(p=>{if(!seen.has(p.id))items.push({id:uid(),kind:'player',op:'remove',playerId:p.id,teamId:ex.id,name:p.name,accept:true})});
  });
  return{id:uid(),title,source,createdAt:Date.now(),items};
}
function finishBatch(b){if(!b.items.length){aiLog&&aiLog('  No differences from your current data.');toast(b.title+': nothing new','');return}
  // keep each batch under the cloud document limit by splitting
  const chunks=[];let cur={...b,items:[]};
  b.items.forEach(it=>{cur.items.push(it);if(JSON.stringify(cur).length>200000){cur.items.pop();chunks.push(cur);cur={...b,id:uid(),title:b.title+' (cont.)',items:[it]}}});chunks.push(cur);
  chunks.forEach(saveBatch);aiLog('  → '+b.items.length+' changes sent to Review');toast(b.title+': '+b.items.length+' changes to review','ok')}

ACT.revApplyAll=async()=>{const bs=Object.values(S.pending).sort((a,b)=>a.createdAt-b.createdAt);const n=bs.reduce((a,b)=>a+b.items.filter(i=>i.accept).length,0);
  if(!await ask('Apply all batches',`Apply the ticked changes in all ${bs.length} batches (${n} changes)? One snapshot is saved first so you can restore it.`,'Apply all'))return;
  await takeSnapshot('Before applying '+bs.length+' batches',true);let t=0,sk=0;bs.forEach(b=>{const r=applyBatch(b);t+=r.n;sk+=r.skipped});
  toast('Applied '+(t-sk)+' changes'+(sk?' ('+sk+' skipped)':''),'ok');rerender()};
ACT.revDiscardAll=async()=>{const bs=Object.values(S.pending);if(!await ask('Discard all',`Discard all ${bs.length} batches? Nothing in them will be applied.`,'Discard all',true))return;bs.forEach(b=>{delete S.pending[b.id];Store.del('pending',b.id)});rerender()};
function applyBatch(b){const touched=new Set();let n=0,skipped=0;
  for(const it of b.items){if(!it.accept)continue;n++;
    const fieldsOn=(it.fields||[]).filter(f=>f.accept);
    if(it.kind==='comp'&&it.op==='add'){const exc=S.comps[it.obj.id]||Object.values(S.comps).find(x=>norm(x.name)===norm(it.obj.name));
      if(exc){let ch=false;['short','country','emblem','season','gameSlot'].forEach(k=>{if(it.obj[k]&&!exc[k]){exc[k]=it.obj[k];ch=true}});if(ch)saveComp(exc);else skipped++;continue}saveComp(clone(it.obj))}
    else if(it.kind==='comp'&&it.op==='update'){const c=S.comps[it.compId];if(c){fieldsOn.forEach(f=>setP(c,f.k,clone(f.to)));saveComp(c)}}
    else if(it.kind==='team'&&it.op==='add'){const ex=S.teams[it.obj.id]||Object.values(S.teams).find(x=>norm(x.name)===norm(it.obj.name));
      // the same new club can arrive in two files: the second one fills in what the first left empty
      if(ex){let ch=false;const o=it.obj;['short','country','compId','stadium','emblem','managerPhoto','formation','playstyle','notes','gameSlot'].forEach(k=>{if(o[k]&&!ex[k]){ex[k]=o[k];ch=true}});
        if(o.manager&&o.manager.name&&!(ex.manager&&ex.manager.name)){ex.manager=clone(o.manager);ch=true}if(Array.isArray(o.colors)&&o.colors.length&&!(ex.colors&&ex.colors.length)){ex.colors=clone(o.colors);ch=true}
        (o.kits||[]).forEach(k=>{const x=(ex.kits||[]).find(y=>y.slot===k.slot);if(!x){(ex.kits=ex.kits||[]).push(clone(k));ch=true}else if(k.img&&!x.img){x.img=k.img;ch=true}});
        if((o.players||[]).length&&!(ex.players||[]).length){ex.players=o.players.map(p=>normPlayer(clone(p)));ch=true}
        if(ch)touched.add(ex.id);else skipped++;continue}const t=clone(it.obj);S.teams[t.id]=t;touched.add(t.id)}
    else if(it.kind==='team'&&it.op==='update'){const t=S.teams[it.teamId];if(t){fieldsOn.forEach(f=>setP(t,f.k,clone(f.to)));touched.add(t.id)}}
    else if(it.kind==='player'){const t=S.teams[it.teamId];if(!t)continue;
      if(it.op==='add'){if(t.players.some(p=>norm(p.name)===norm(it.obj.name))){skipped++;continue}t.players.push(normPlayer(clone(it.obj)));touched.add(t.id)}
      else if(it.op==='remove'){if(!t.players.some(p=>p.id===it.playerId)){skipped++;continue}t.players=t.players.filter(p=>p.id!==it.playerId);touched.add(t.id)}
      else if(it.op==='update'){const p=t.players.find(x=>x.id===it.playerId);if(p){fieldsOn.forEach(f=>setP(p,f.k,clone(f.to)));normPlayer(p);touched.add(t.id)}}
      else if(it.op==='move'){const from=S.teams[it.fromTeam];const f0=from&&from.players.find(x=>x.id===it.playerId);if(!f0){const here=t.players.find(x=>x.id===it.playerId);if(here){fieldsOn.forEach(f=>setP(here,f.k,clone(f.to)));normPlayer(here);touched.add(t.id)}else skipped++;continue}if(f0){from.players=from.players.filter(x=>x.id!==it.playerId);fieldsOn.forEach(f=>setP(f0,f.k,clone(f.to)));normPlayer(f0);t.players.push(f0);touched.add(from.id);touched.add(t.id)}}}
  }
  touched.forEach(id=>S.teams[id]&&saveTeam(S.teams[id]));delete S.pending[b.id];Store.del('pending',b.id);return{n,skipped}}

VIEWS.compare=()=>{
  const snaps=Object.values(S.snaps).sort((a,b)=>b.createdAt-a.createdAt);
  const srcOpts=[['baseline','Baseline'+(S.settings.baseline&&S.snaps[S.settings.baseline]?' ('+S.snaps[S.settings.baseline].name+')':' (not set)')],['current','Current data'],...snaps.map(s=>[s.id,s.name+' · '+fmtDate(s.createdAt)])];
  const A=dataFor(S.ui.cmpA),B=dataFor(S.ui.cmpB);
  let res='';
  if(A===null||B===null)res='<div class="card"><p>Choose two versions. Take a snapshot first if you have none.</p></div>';
  else if(A===undefined||B===undefined)res='<p class="muted">Loading snapshot…</p>';
  else res=diffView(diffData(A,B),A,B);
  return `<h1>Compare &amp; versions</h1><p class="sub">Snapshots freeze your whole project. Compare any two (or a snapshot against your current data), restore an older one, and pick which version counts as the in-game baseline.</p>
  <div class="grid g2"><div class="card"><h3>Compare</h3><div class="form"><label class="f">Old (A)<select data-ch="cmpA">${opts(srcOpts,S.ui.cmpA)}</select></label><label class="f">New (B)<select data-ch="cmpB">${opts(srcOpts,S.ui.cmpB)}</select></label></div>
    <div class="row" style="margin-top:10px"><select data-ch="cmpTeam" aria-label="Team filter"><option value="">All teams</option>${opts(teamsArr().map(t=>[t.id,t.name]),S.ui.cmpTeam)}</select><input type="search" placeholder="Player name" value="${esc(S.ui.cmpQ)}" data-in="cmpQ" aria-label="Filter by player">
    ${Object.entries({comps:'Competitions',teams:'Teams',players:'Players'}).map(([k,l])=>`<label class="c small"><input type="checkbox" data-act="cmpKind" data-k="${k}" ${S.ui.cmpKinds[k]?'checked':''}>${l}</label>`).join('')}</div></div>
   <div class="card"><h3>Snapshots</h3><div class="row" style="margin-bottom:8px"><button class="primary sm" data-act="snapNew">Take snapshot</button></div>
    <div style="max-height:220px;overflow:auto"><table><tbody>${snaps.map(s=>`<tr><td>${esc(s.name)}${S.settings.baseline===s.id?' <span class="tag t-upd">baseline</span>':''}<div class="small muted">${s.uploading?'<span style="color:var(--warn)">saving…</span> · ':s.failed?'<span style="color:var(--bad)">not saved</span> · ':''}${fmtDate(s.createdAt)} · ${s.counts?s.counts.teams+' teams, '+s.counts.players+' players':''}</div></td>
    <td style="text-align:right;white-space:nowrap"><button class="sm" data-act="snapBase" data-id="${s.id}">Set baseline</button><button class="sm" data-act="snapRestore" data-id="${s.id}">Restore</button><button class="sm ghost danger" data-act="snapDel" data-id="${s.id}">Delete</button></td></tr>`).join('')||'<tr><td class="muted">No snapshots yet.</td></tr>'}</tbody></table></div></div></div>
  <h2>Differences</h2>${res}
  <h2>Head-to-head</h2>${h2hView()}`;
};

function diffView(d,A,B){
  const tf=S.ui.cmpTeam,q=norm(S.ui.cmpQ);const k=S.ui.cmpKinds;
  let pl=d.players;if(tf)pl=pl.filter(x=>(x.tA&&x.tA.id===tf)||(x.tB&&x.tB.id===tf));if(q)pl=pl.filter(x=>norm(x.p.name).includes(q));
  let tm=d.teams;if(tf)tm=tm.filter(x=>x.id===tf);
  const cnt=t=>pl.filter(x=>x.type===t).length;
  const fchips=fs=>fs.map(f=>{const num=NUMERIC.has(f.k)&&isFinite(+f.from)&&isFinite(+f.to)&&f.from!==''&&f.to!=='';const dd=num?(+f.to)-(+f.from):0;
    return `<span class="chip">${esc(LABEL[f.k]||f.k)}: ${num?`${esc(f.from)} → <b>${esc(f.to)}</b> <span class="${dd>0?'up':'down'}">${dd>0?'+':''}${dd}</span>`:`${fmtVal(f.k,f.from,A)} → ${fmtVal(f.k,f.to,B)}`}</span>`}).join('');
  const sum=`<div class="grid g4" style="margin-bottom:12px"><div class="tile"><div class="n">${d.comps.length}</div><div class="l">Competition changes</div></div><div class="tile"><div class="n">${tm.length}</div><div class="l">Team changes</div></div>
   <div class="tile"><div class="n up">${cnt('added')}</div><div class="l">Players added</div></div><div class="tile"><div class="n down">${cnt('removed')}</div><div class="l">Players removed</div></div><div class="tile"><div class="n" style="color:var(--gold)">${cnt('moved')}</div><div class="l">Transfers</div></div><div class="tile"><div class="n">${cnt('changed')}</div><div class="l">Players changed</div></div></div>`;
  if(!d.comps.length&&!tm.length&&!pl.length)return sum+'<div class="card"><p>No differences between these two versions.</p></div>';
  return sum+(k.comps&&d.comps.length?`<h3>Competitions</h3><div class="grid" style="gap:6px;margin-bottom:14px">${d.comps.map(x=>`<div class="rev-item"><span class="tag ${x.type==='added'?'t-add':x.type==='removed'?'t-rem':'t-upd'}">${x.type}</span> <b>${esc(x.obj.name)}</b> ${x.fields?fchips(x.fields):''}</div>`).join('')}</div>`:'')
   +(k.teams&&tm.length?`<h3>Teams</h3><div class="grid" style="gap:6px;margin-bottom:14px">${tm.map(x=>`<div class="rev-item"><span class="tag ${x.type==='added'?'t-add':x.type==='removed'?'t-rem':'t-upd'}">${x.type}</span> <b>${esc(x.obj.name)}</b> ${x.fields?fchips(x.fields):''}</div>`).join('')}</div>`:'')
   +(k.players&&pl.length?`<h3>Players</h3><div class="tw"><table><thead><tr><th>Change</th><th>Player</th><th>Team</th><th class="num">OVR</th><th>Details</th></tr></thead><tbody>${pl.slice(0,400).map(x=>{const [c,l]=x.type==='added'?['t-add','added']:x.type==='removed'?['t-rem','removed']:x.type==='moved'?['t-mov','transfer']:['t-upd','changed'];
     return `<tr><td><span class="tag ${c}">${l}</span></td><td><b>${esc(x.p.name)}</b></td><td class="small">${x.type==='moved'?esc(x.tA.name)+' → '+esc(x.tB.name):esc((x.tB||x.tA).name)}</td>
     <td class="num">${x.pA?`${ovr(x.pA)} → `:''}${statHTML(ovr(x.p))}${x.dOvr?` <span class="${x.dOvr>0?'up':'down'} small">${x.dOvr>0?'+':''}${x.dOvr}</span>`:''}</td><td>${x.fields?fchips(x.fields):''}</td></tr>`}).join('')}</tbody></table></div>${pl.length>400?'<p class="muted small">Showing the first 400; filter by team or name to see more.</p>':''}`:'');
}

async function imgBlobFor(id,resize){const i=S.images[id];if(!i)return null;let b=await Store.getBlob(i.ref);if(!b)return null;

  try{

ACT.impGo=async()=>{const st=impState();try{st.tables.filter(t=>t.on&&t.kind!=='unknown').forEach(t=>{try{presetSave(t)}catch(e){}});await miniBusy('Matching imported data…',async()=>{await sleep(30);await impBuild()})}catch(e){toast('Import failed: '+e.message,'err')}};
async function impBuild(){
  const st=impState();const o=st.opts;const replace=o.mode==='replace';IMP_TCACHE=new Map();
  const inc={},incC={},stats={teams:0,players:0,newPlayers:0,images:0,unmatched:0};
  const getInc=t=>inc[t.id]||(inc[t.id]=Object.assign(clone(t),{players:[]}));
  const virt={};// new teams created from files
  const teamFor=(name,comp)=>{let t=matchTeam(name,comp);if(t)return t;if(!o.addTeams||!name)return null;const k=norm(name);
    if(!virt[k]){const c=comp?matchComp(comp):null;virt[k]=newTeam({name:String(name).trim(),short:shortName(name),compId:c?c.id:'',kits:[newKit('1st'),newKit('2nd'),newKit('GK 1st','#1c1c1c','#1c1c1c')]});IMP_TCACHE.set(norm(name)+'|'+(comp||''),virt[k]);inc[virt[k].id]=virt[k]}
    return virt[k]};
  const fill=(obj,path,v)=>{if(v==null||v==='')return false;const cur=getP(obj,path);if(!replace&&cur!=null&&cur!==''&&!(Array.isArray(cur)&&!cur.length))return false;if(canon(cur)===canon(v))return false;setP(obj,path,v);return true};
  await impTedStep({st,o,replace,inc,getInc,stats});
  // competitions & clubs sheets
  st.tables.filter(t=>t.on&&t.kind==='comps').forEach(t=>{const H=t.headers.map(h=>norm(h));const ni=H.indexOf('name'),ci=H.indexOf('country name');
    t.rows.forEach(r=>{const c=matchComp(r[ni]);if(c){const x=incC[c.id]||clone(c);if(fill(x,'country',ci>=0?r[ci]:''))incC[c.id]=x}})});
  st.tables.filter(t=>t.on&&t.kind==='clubs').forEach(t=>{const H=t.headers.map(h=>norm(h));const ni=H.indexOf('name'),si=H.indexOf('stadium name'),ki=H.indexOf('coach name'),di=H.indexOf('domestic competition id');
    t.rows.forEach(r=>{const tm=teamFor(r[ni],di>=0?r[di]:'');if(!tm)return;const x=inc[tm.id]||getInc(tm);let ch=false;
      if(si>=0)ch=fill(x,'stadium',r[si])||ch;if(ki>=0)ch=fill(x,'manager.name',r[ki])||ch;if(ch)stats.teams++})});
  // players sheets
  for(const t of st.tables.filter(t=>t.on&&t.kind==='players')){
    const recs=impRecs(t);
    for(const r of recs){const tm=teamFor(r.team,r.comp);if(!tm){stats.unmatched++;continue}
      const x=inc[tm.id]||getInc(tm);const src=S.teams[tm.id];
      let p=x.players.find(q=>samePlayer(q.name,r.name));let isNew=false;
      if(!p){const exP=src&&(src.players||[]).find(q=>samePlayer(q.name,r.name));if(exP)p=clone(exP);else{if(!o.addPlayers&&src)continue;p=newPlayer({name:r.name,pos:r.pos||'CMF'});isNew=true}x.players.push(p)}
      const force=replace||isNew;const before=canon(p);
      const f=(k,v)=>{if(v==null||v==='')return;if(force||p[k]===''||p[k]==null)p[k]=v};
      f('shirtName',r.shirtName);f('number',r.number);f('age',r.age);f('nat',r.nat);f('height',r.height);f('weight',r.weight);if(r.foot&&(force||unrated(p)))p.foot=r.foot;
      if(r.pos&&(force))p.pos=r.pos;
      const canRate=force||unrated(p);
      if(canRate&&r.attrs){Object.assign(p.attrs,r.attrs);if(r.wf){p.wfAcc=r.wf;p.wfUsage=r.wf}}
      else if(canRate&&o.estimate){const target=r.ovr||valueToOvr(r.value,r.age||p.age);if(target)p.attrs=attrsFromOvr(p.name,p.pos,target)}
      normPlayer(p);if(isNew)stats.newPlayers++;else if(canon(p)!==before)stats.players++;
      await null;
    }
  }
  // images: upload the ones that will fill a slot, then assign
  const imgs=st.images.filter(i=>i.on&&i.target&&(replace||!targetHasImage(i.target)));
  for(const it of imgs){const [k,a,b]=it.target.split(':');let rec;
    try{rec=await addImageFromBlob(it.blob,k==='comp'?'comp':k==='kit'?'kit':k==='manager'?'manager':'emblem',it.name)}catch(e){st.skipped.push(it.name+': '+e.message);continue}
    stats.images++;
    if(k==='comp'){const c=S.comps[a];if(!c)continue;const x=incC[a]||clone(c);x.emblem=rec.id;incC[a]=x;continue}
    const tm=S.teams[a]||Object.values(virt).find(v=>v.id===a);if(!tm)continue;const x=inc[tm.id]||getInc(tm);
    if(k==='emblem')x.emblem=rec.id;else if(k==='manager')x.managerPhoto=rec.id;else{let kt=x.kits.find(z=>z.slot===b);if(!kt){kt=newKit(b);x.kits.push(kt)}kt.img=rec.id}}
  // drop untouched team copies so they don't show as empty updates
  Object.keys(inc).forEach(id=>{const x=inc[id];const src=S.teams[id];if(src&&!x.players.length&&!diffObj(src,x,TEAM_PATHS).length)delete inc[id]});
  const names=[...(st.teds||[]).filter(t=>t.on!==false).map(t=>t.name||t.file||'team file'),...st.tables.filter(t=>t.on).map(t=>t.name),...(imgs.length?[imgs.length+' images']:[])].join(', ');
  const b=batchFromData({teams:inc,comps:incC},{title:'Import: '+(names.length>80?names.slice(0,78)+'…':names),source:'Files',removeMissing:false,teamScope:[]});
  b.notes=[`${stats.players} existing players filled, ${stats.newPlayers} players added, ${stats.images} images uploaded${stats.unmatched?`, ${stats.unmatched} rows skipped because their club isn't in your project`:''}.`,
    o.mode==='fill'?'Fill mode: only empty fields, unrated players and empty image slots were touched.':'Replace mode: values from the files overwrite existing ones.'];
  if(!b.items.length){toast('Nothing to fill: your data already has these values','ok');return}
  finishBatch(b);location.hash='review';
}

/* ================= v2: rating calibration ================= */
// Least-squares line per ability, fitted on players found both in an EA FC sheet and in real PES 2021 team files.
function fitLine(xs,ys){const n=xs.length;if(n<8)return null;const mx=xs.reduce((a,b)=>a+b,0)/n,my=ys.reduce((a,b)=>a+b,0)/n;let sxy=0,sxx=0;
  for(let i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)**2}if(!sxx)return null;const a=sxy/sxx;const b=my-a*mx;
  let se=0;for(let i=0;i<n;i++)se+=(ys[i]-(a*xs[i]+b))**2;return{a:+a.toFixed(4),b:+b.toFixed(3),n,rmse:+Math.sqrt(se/n).toFixed(2)}}
function calibrateFrom(tbl){
  const truth=[];Object.values(S.teams).forEach(t=>(t.players||[]).forEach(p=>{if(p.src==='ted')truth.push({p,t})}));
  if(!truth.length)return{error:'Import some PES team files (.ted) first: their ratings are the reference.'};
  const byName=new Map();truth.forEach(x=>{const k=norm(x.p.name);byName.set(k,byName.has(k)?null:x)});
  const pairs=[];const ea=tbl.fmt==='EA FC';
  tbl.rows.forEach(r=>{const g=k=>tbl.map[k]>=0?String(r[tbl.map[k]]??'').trim():'';const nm=g('name');if(!nm)return;let hit=byName.get(norm(nm));
    if(!hit){hit=truth.find(x=>samePlayer(x.p.name,nm))||null}if(!hit)return;pairs.push({r,p:hit.p})});
  if(pairs.length<8)return{error:'Only '+pairs.length+' players matched your PES data; at least 8 are needed.'};
  const out={attrs:{},n:pairs.length,at:Date.now(),source:tbl.name};
  Object.entries(tbl.map.attrs||{}).forEach(([k,a])=>{const xs=[],ys=[];pairs.forEach(({r,p})=>{const vals=a.cols.map(i=>cellNum(r[i])).filter(v=>v!=null);if(!vals.length)return;
    xs.push(vals.reduce((x,y)=>x+y,0)/vals.length);ys.push(p.attrs[k])});const f=fitLine(xs,ys);if(f&&f.a>0.2&&f.a<2)out.attrs[k]=f});
  if(tbl.map.ovr>=0){const xs=[],ys=[];pairs.forEach(({r,p})=>{const v=cellNum(r[tbl.map.ovr]);if(v){xs.push(v);ys.push(ovr(p))}});const f=fitLine(xs,ys);if(f)out.ovr=f}
  if(tbl.map.value>=0){const xs=[],ys=[];pairs.forEach(({r,p})=>{const v=cellNum(r[tbl.map.value]);if(v>1000){xs.push(Math.log10(v));ys.push(ovr(p))}});const f=fitLine(xs,ys);if(f)out.value=f}
  out.fmt=tbl.fmt;return out}
const _ovrFromEAOrig=ovrFromEA,_valueToOvrOrig=valueToOvr;
function calibAttr(k,v){const c=S.settings.calib&&S.settings.calib.attrs&&S.settings.calib.attrs[k];return c?clamp(Math.round(c.a*v+c.b),40,99):eaToPes(v)}
ovrFromEA=v=>{const c=S.settings.calib&&S.settings.calib.ovr;return c?clamp(Math.round(c.a*v+c.b),40,99):_ovrFromEAOrig(v)};
valueToOvr=(v,age)=>{const c=S.settings.calib&&S.settings.calib.value;if(c&&+v>1000){let o=c.a*Math.log10(+v)+c.b;if(age>28)o+=(age-28)*0.6;return clamp(Math.round(o),48,92)}return _valueToOvrOrig(v,age)};
ACT.impCalib=async el=>{const t=impState().tables.find(x=>x.id===el.dataset.t);const r=calibrateFrom(t);if(r.error){toast(r.error,'err');return}
  const ks=Object.keys(r.attrs).length;const avg=ks?(Object.values(r.attrs).reduce((a,b)=>a+b.rmse,0)/ks).toFixed(1):'–';
  if(!await ask('Use this calibration?',`Matched <b>${r.n}</b> players between <b>${esc(t.name)}</b> and your PES team files. Fitted ${ks} abilities (average error ±${avg})${r.ovr?', overall':''}${r.value?', market value':''}. New imports will convert with these lines.`,'Use it'))return;
  S.settings.calib=r;saveSettings();impRefreshStats();toast('Calibration saved','ok');rerender()};

/* ================= v2: health checks & cleanup ================= */
const isNationalComp=c=>!!c&&/national|nation|world cup|euro|copa am|afcon|africa cup|asian cup/i.test(c.name);
const isCupComp=c=>!!c&&(c.type==='Cup'||/champions|europa|conference|libertadores|sudamericana|club world/i.test(c.name));
function findCupDuplicates(){const out=[];const leagueTeams=teamsArr().filter(t=>{const c=S.comps[t.compId];return !isCupComp(c)});
  teamsArr().forEach(t=>{const c=S.comps[t.compId];if(!isCupComp(c)||isNationalComp(c))return;let best=null,bs=0;
    leagueTeams.forEach(l=>{if(l.id===t.id)return;const sc=nameScore(t.name,l.name);if(sc>bs){bs=sc;best=l}});if(best&&bs>=0.8)out.push({cup:t,league:best,score:bs,comp:c})});return out}
function healthIssues(){const issues=[];const add=(sev,cat,msg,act)=>issues.push({sev,cat,msg,act});
  teamsArr().forEach(t=>{const ps=t.players||[];const c=S.comps[t.compId];const nat=isNationalComp(c);
    if(ps.length>40)add('err','Squad size',`${t.name} has ${ps.length} players; the game allows 40`,{a:'openTeam',id:t.id});
    else if(ps.length&&ps.length<18)add('warn','Squad size',`${t.name} has only ${ps.length} players`,{a:'openTeam',id:t.id});
    if(ps.length&&!ps.some(p=>p.pos==='GK'))add('err','Goalkeepers',`${t.name} has no goalkeeper`,{a:'openTeam',id:t.id});
    else if(ps.length>=18&&ps.filter(p=>p.pos==='GK').length<2)add('warn','Goalkeepers',`${t.name} has only one goalkeeper`,{a:'openTeam',id:t.id});
    const nums={};ps.forEach(p=>{if(p.number)(nums[p.number]=nums[p.number]||[]).push(p.name)});const dup=Object.entries(nums).filter(([n,a])=>a.length>1);
    if(dup.length)add('warn','Shirt numbers',`${t.name}: ${dup.map(([n,a])=>'#'+n+' '+a.join(' & ')).join('; ')}`,{a:'fixNumbers',id:t.id,label:'Renumber'});
    const noNum=ps.filter(p=>!p.number).length;if(noNum)add('info','Shirt numbers',`${t.name}: ${noNum} players without a number`,{a:'fixNumbers',id:t.id,label:'Give numbers'});
    const longN=ps.filter(p=>new TextEncoder().encode(p.name).length>60||String(p.shirtName||'').length>16);if(longN.length)add('warn','Names',`${t.name}: ${longN.length} names too long for the game (${longN.slice(0,3).map(p=>p.name).join(', ')})`,{a:'openTeam',id:t.id});
    if(!t.emblem)add('info','Images',`${t.name} has no emblem`,{a:'openTeamImg',id:t.id});
    if(t.short&&t.short.length!==3)add('warn','Team info',`${t.name}: short name "${t.short}" should be 3 letters`,{a:'openTeamInfo',id:t.id});
    const un=ps.filter(unrated).length;if(un)add('info','Ratings',`${t.name}: ${un} unrated players`,{a:'rateTeam',id:t.id,label:'Queue Claude ratings'});
    if(!S.comps[t.compId])add('info','Competitions',`${t.name} isn't in a competition`,{a:'openTeamInfo',id:t.id})});
  return issues}
function findDuplicatePlayers(){const by=new Map();teamsArr().forEach(t=>{if(isNationalComp(S.comps[t.compId]))return;(t.players||[]).forEach(p=>{const k=p.ted&&p.ted.pid?'id:'+p.ted.pid:'n:'+norm(p.name)+'|'+(p.age||'');(by.get(k)||by.set(k,[]).get(k)).push({p,t})})});
  return [...by.values()].filter(a=>a.length>1&&new Set(a.map(x=>x.t.id)).size>1)}

  <h2>Issues</h2><div class="row" style="margin-bottom:8px"><select data-ch="hfCat" aria-label="Category"><option value="">All categories</option>${opts(cats,f.cat)}</select><select data-ch="hfSev" aria-label="Severity"><option value="">All levels</option>${opts([['err','Problems'],['warn','Warnings'],['info','Info']],f.sev)}</select>
   <span class="spacer"></span><button class="sm" data-act="fixAllNumbers">Give every squad clean numbers</button></div>
  <div class="tw" style="max-height:420px"><table><tbody>${list.slice(0,500).map(i=>`<tr><td><span class="tag ${i.sev==='err'?'t-rem':i.sev==='warn'?'t-mov':'t-upd'}">${i.sev==='err'?'problem':i.sev==='warn'?'warning':'info'}</span></td><td class="small muted">${esc(i.cat)}</td><td>${esc(i.msg)}</td><td style="text-align:right">${i.act?`<button class="sm" data-act="${i.act.a}" data-id="${i.act.id}">${esc(i.act.label||'Open')}</button>`:''}</td></tr>`).join('')||'<tr><td class="muted">Nothing to report.</td></tr>'}</tbody></table></div>${list.length>500?`<p class="small muted">Showing 500 of ${list.length}.</p>`:''}
  <h2>Same player in two clubs</h2>${dp.length?`<div class="tw" style="max-height:360px"><table><thead><tr><th>Player</th><th>Clubs</th><th>Keep at</th></tr></thead><tbody>${dp.slice(0,300).map((a,i)=>`<tr><td><b>${esc(a[0].p.name)}</b> <span class="muted small">${a[0].p.ted?'same game ID':'same name & age'}</span></td><td class="small">${a.map(x=>esc(x.t.name)+' (OVR '+ovr(x.p)+')').join(' · ')}</td>
   <td>${a.map(x=>`<button class="sm" data-act="keepAt" data-i="${i}" data-t="${x.t.id}">${esc(x.t.short||x.t.name)}</button>`).join(' ')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="card"><p class="small">No duplicates. National teams are ignored here because their players also play for clubs.</p></div>'}
  <h2>In-game slots</h2><div class="card"><p class="small">${noSlot?`<b>${noSlot}</b> teams don't say which default PES team they replace.`:'Every team names the in-game team it replaces.'} Set it under Teams → Club info → <b>Replaces in-game team</b>. Teams imported from team files fill it in automatically. The Update Sheet uses it to tell you which team to open in Edit mode.</p>
   ${slotGuideHTML()}</div>`};
function slotGuideHTML(){const rows=compsArr().map(c=>{const ts=isCupComp(c)&&(c.teams||[]).length?(c.teams||[]).map(id=>S.teams[id]).filter(Boolean):teamsArr().filter(t=>t.compId===c.id);return{c,ts}}).filter(r=>r.ts.length);

function renumber(t){const used=new Set();const pref={GK:[1,12,13,99],CB:[4,5,3,15,6],LB:[3,2,23],RB:[2,22],DMF:[6,16,18],CMF:[8,14,16],LMF:[11,7],RMF:[7,17],AMF:[10,20],LWF:[11,7,19],RWF:[7,17,21],SS:[10,9],CF:[9,19,20]};
  const ps=(t.players||[]).slice().sort((a,b)=>ovr(b)-ovr(a));const keep=new Set();ps.forEach(p=>{if(p.number&&!used.has(+p.number)){used.add(+p.number);keep.add(p.id)}});
  ps.forEach(p=>{if(keep.has(p.id))return;let n=(pref[p.pos]||[]).find(x=>!used.has(x));if(!n){n=1;while(used.has(n)&&n<99)n++}used.add(n);p.number=n})}

/* ================= v2: Claude job queue (survives reloads, retries when busy) ================= */
function jobsArr(){return Object.values(S.jobs).sort((a,b)=>a.createdAt-b.createdAt||a.seq-b.seq)}
let JOBSEQ=0;
function queueAdd(list,{run=true}={}){list.forEach(j=>{const job=Object.assign({id:uid(),status:'queued',attempts:0,createdAt:Date.now(),seq:JOBSEQ++},j);S.jobs[job.id]=job;Store.put('jobs',job)});
  if(run&&!S.ui.ai.running)setTimeout(queueRun,50);else if(S.ui.ai.running&&S.ui.ai.queue){progAddRoot(list.length)}rerender()}
function progAddRoot(n){const st=S.ui.ai.stack;if(st&&st.length)st[0].total+=n;progRender()}
function jobSave(j){S.jobs[j.id]=j;Store.put('jobs',j)}
async function runJob(j,signal){const season=j.season||S.settings.season;
  if(j.type==='team'){const base=S.teams[j.teamId]||j.virtual;if(!base)throw new Error('team no longer exists');const parts=new Set(j.parts||[]);
    const inc=await draftTeam(base,parts,season,signal);if(parts.has('crest'))await flAttach(inc,'emblem',signal);finishBatch(batchFromData({teams:{[inc.id]:inc},comps:{}},{title:'Claude: '+inc.name+' ('+season+')',source:'Claude',removeMissing:parts.has('roster'),teamScope:[inc.id]}));return}
  if(j.type==='ratings'){await runPlayerRatings(j.ids||[],season,signal);return}
  if(j.type==='kits'){const t=S.teams[j.teamId];if(t)await runKitCheck(t,season,signal);return}
  if(j.type==='compCheck'){const c=S.comps[j.compId];if(c)await runCompCheck(c,season,signal);return}
  if(j.type==='comp'){await buildCompAIQueued(j,signal);return}
  if(j.type==='logos'){await runLogoJob(j,signal);return}
  throw new Error('unknown job')}
// a competition job fetches the clubs, then queues one job per club so long builds can resume club by club
async function buildCompAIQueued(j,signal){aiLog('Asking Claude for the clubs in '+j.name+'…');const r=await aiJSON(compPrompt(j.name,j.country,j.season),signal);if(r.knowledgeNote)aiLog('  Note: '+r.knowledgeNote);
  const rc=r.competition||{};let comp=Object.values(S.comps).find(c=>norm(c.name)===norm(rc.name||j.name)||norm(c.name)===norm(j.name));
  const incComp=comp?clone(comp):newComp({id:j.compId||uid(),name:rc.name||j.name,short:rc.short||'',country:rc.country||j.country,type:rc.type==='Cup'?'Cup':'League',season:j.season});if(comp)incComp.season=j.season;
  const teams=(Array.isArray(r.teams)?r.teams:[]).filter(t=>t&&t.name);aiLog('  '+teams.length+' clubs');const virt={};
  teams.forEach(rt=>{const ex=Object.values(S.teams).find(t=>norm(t.name)===norm(rt.name));const t=ex?clone(ex):newTeam({name:rt.name,short:(rt.short||shortName(rt.name)).toUpperCase().slice(0,3),country:rt.country||j.country,stadium:rt.stadium||''});t.compId=incComp.id;virt[t.id]=t});
  await flAttach(incComp,'comp',signal);finishBatch(batchFromData({comps:{[incComp.id]:incComp},teams:j.squads?{}:virt},{title:'Claude: '+incComp.name+' clubs ('+j.season+')',source:'Claude',removeMissing:false,teamScope:[]}));
  if(j.squads){const parts=['roster','transfers','bio','styles','manager','kits','crest'];if(j.stats!==false)parts.push('newStats');
    queueAdd(Object.values(virt).map(t=>S.teams[t.id]?{type:'team',teamId:t.id,parts,season:j.season,label:t.name}:{type:'team',virtual:t,parts,season:j.season,label:t.name}),{run:false});aiLog('  Queued '+Object.keys(virt).length+' squads')}}
async function queueRun(){if(S.ui.ai.running)return;const pending=jobsArr().filter(j=>j.status==='queued');if(!pending.length)return;
  S.ui.ai.log=S.ui.ai.log||[];const signal=startAI(pending.length);S.ui.ai.queue=true;
  try{while(!signal.aborted){const j=jobsArr().find(x=>x.status==='queued'&&(!x.notBefore||x.notBefore<=Date.now()));
      if(!j){const later=jobsArr().find(x=>x.status==='queued');if(!later)break;await sleep(Math.min(20000,Math.max(500,later.notBefore-Date.now())));continue}
      j.status='running';j.startedAt=Date.now();jobSave(j);aiLog('▶ '+(j.label||j.type));progPush(1);
      try{await runJob(j,signal);j.status='done';j.doneAt=Date.now();j.error='';jobSave(j)}
      catch(e){if(e.name==='AbortError'||signal.aborted){j.status='queued';jobSave(j);break}
        j.attempts=(j.attempts||0)+1;const busy=/busy|rate|unavailable|timeout|network/i.test(e.message||'');
        if(busy&&j.attempts<4){j.status='queued';j.notBefore=Date.now()+15000*j.attempts;aiLog('  Busy, will retry ('+j.attempts+'/3): '+e.message);progAddRoot(1)}
        else{j.status='error';j.error=e.message;aiLog('  Failed: '+e.message)}jobSave(j)}
      finally{progPop()}}}
  finally{S.ui.ai.queue=false;endAI()}}
function queueHTML(){const js=jobsArr();if(!js.length)return'';const c=s=>js.filter(j=>j.status===s).length;const run=S.ui.ai.running;
  return `<h2>Job queue <span class="muted small">${c('queued')} waiting · ${c('running')} running · ${c('done')} done · ${c('error')} failed</span></h2>
  <div class="card"><div class="row" style="margin-bottom:8px">${run?'<button class="danger sm" data-act="aiCancel">Pause</button>':c('queued')?'<button class="primary sm" data-act="qResume">Resume queue</button>':''}
   <button class="sm" data-act="qRetry" ${c('error')?'':'disabled'}>Retry failed</button><button class="sm" data-act="qClear" ${c('done')?'':'disabled'}>Clear finished</button><button class="sm ghost danger" data-act="qClearAll">Remove all waiting</button></div>
   <div class="tw" style="max-height:300px"><table><tbody>${js.slice(-300).reverse().map(j=>`<tr><td><span class="tag ${j.status==='done'?'t-add':j.status==='error'?'t-rem':j.status==='running'?'t-mov':'t-upd'}">${j.status}</span></td><td>${esc(j.label||j.type)}</td><td class="small muted">${esc({team:'Squad',ratings:'Ratings',kits:'Kits',compCheck:'Clubs',comp:'Competition',logos:'Logos'}[j.type]||j.type)}${j.attempts?' · '+j.attempts+' retries':''}</td><td class="small" style="color:var(--bad)">${esc(j.error||'')}</td><td>${j.status!=='running'?`<button class="sm ghost" data-act="qDel" data-id="${j.id}" aria-label="Remove">×</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`}
ACT.qResume=()=>queueRun();
ACT.qRetry=()=>{jobsArr().filter(j=>j.status==='error').forEach(j=>{j.status='queued';j.attempts=0;j.error='';jobSave(j)});queueRun();rerender()};
ACT.qClear=()=>{jobsArr().filter(j=>j.status==='done').forEach(j=>{delete S.jobs[j.id];Store.del('jobs',j.id)});rerender()};
ACT.qClearAll=async()=>{if(!await ask('Remove waiting jobs','Remove every job that hasn\'t run yet?','Remove',true))return;jobsArr().filter(j=>j.status==='queued'||j.status==='error').forEach(j=>{delete S.jobs[j.id];Store.del('jobs',j.id)});rerender()};

function gridGet(p,k){const b=gridState().buf.get(p.id);if(b&&k in b)return b[k];return ATTR_KEYS.includes(k)?p.attrs[k]:p[k]}
function gridCoerce(type,v){v=String(v==null?'':v).trim();
  if(type==='a'){const n=Math.round(+v);return isFinite(n)&&v!==''?clamp(n,40,99):null}
  if(type==='n'){if(v==='')return '';const n=Math.round(+v);return isFinite(n)?n:null}
  if(/^n\d\d$/.test(type)){const lo=+type[1],hi=+type[2];const n=Math.round(+v);return isFinite(n)?clamp(n,lo,hi):null}

function filesPicker(accept){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.multiple=true;i.accept=accept;i.style.display='none';document.body.appendChild(i);i.addEventListener('change',()=>pickerDone(i,res,[...i.files]));watchPicker(i,res);i.click()})}
const IMG_EXT=/\.(png|jpe?g|webp|gif|svg|bmp)$/i;
ACT.importPkg=async()=>{const fs=await filesPicker('.zip,.json,application/json,application/zip');if(!fs||!fs.length)return;closeModal();await importUpdateFiles(fs)};
async function importUpdateFiles(files){let n=0,leftImgs=[];const errs=[];
  await miniBusy('Reading '+files.length+' file'+(files.length===1?'':'s')+'…',async()=>{
    for(const f of files){try{
      if(/\.zip$/i.test(f.name)){if(typeof JSZip==='undefined')throw new Error('ZIP library not loaded');const z=await JSZip.loadAsync(f);
        if(z.file('data/project-backup.json')){await importStudioFile(f,z);n++;continue}
        const ents=Object.values(z.files).filter(e=>!e.dir&&!e.name.includes('__MACOSX')&&!e.name.split('/').pop().startsWith('.'));
        const jsons=ents.filter(e=>/\.json$/i.test(e.name));const imgs=[];for(const e of ents.filter(e=>IMG_EXT.test(e.name)))imgs.push({path:e.name,blob:new Blob([await e.async('arraybuffer')],{type:/\.svg$/i.test(e.name)?'image/svg+xml':'image/'+(e.name.split('.').pop().toLowerCase().replace('jpg','jpeg'))})});
        if(!jsons.length){leftImgs.push(...imgs);continue}
        for(let k=0;k<jsons.length;k++){const d=JSON.parse(await jsons[k].async('string'));const r=await importUpdateData(d,f.name+(jsons.length>1?' › '+jsons[k].name.split('/').pop():''),k===0?imgs:[]);leftImgs.push(...r.left);n++}}
      else{const d=JSON.parse(await f.text());if(d&&d.app==='pes21-option-studio'&&!d.mode){await importStudioFile(f,null,d);n++;continue}const r=await importUpdateData(d,f.name,[]);leftImgs.push(...r.left);n++}
    }catch(e){errs.push(f.name+': '+(e.message||e))}}});
  if(leftImgs.length){for(const it of leftImgs){try{await impAddImage(it.blob,it.path,(it.path.split('.').pop()||'png').toLowerCase())}catch(e){}}impRefreshStats();
    toast(leftImgs.length+' images didn\'t belong to a club in the file. They are on Import files to match by hand.','');}
  if(errs.length)toast('Could not read: '+errs.join('; '),'err');
  if(n)location.hash='review';else if(leftImgs.length)location.hash='import'}
async function fetchImage(url){const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),20000);
  const ok=b=>{if(!/^image\//.test(b.type)&&!/\.(png|jpe?g|webp|svg)(\?|$)/i.test(url))throw new Error('not an image');return b};
  try{if(!/footylogos\.com/i.test(url)){try{const r=await fetch(url,{mode:'cors',signal:ctl.signal});if(r.ok)return await flFix(ok(await r.blob()))}catch(e){if(!(window.claude&&window.claude.standalone))throw e}}
    if(!(window.claude&&window.claude.standalone))throw new Error('blocked by the site');
    const r=await fetch('api/image?url='+encodeURIComponent(url),{signal:ctl.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await flFix(await r.blob())}
  finally{clearTimeout(tm)}}
const nkey=s=>norm(String(s||'').replace(/\.[a-z0-9]{2,4}$/i,''));
async function importUpdateData(data,fname,imgs){expandCompact(data);if(!data||(!data.teams&&!data.comps))throw new Error('not an update file');if(!data.mode)data.mode='partial';
  data.notes=Array.isArray(data.notes)?data.notes:[];const clubNames=new Map(),compNames=new Map();
  Object.values(data.teams||{}).forEach(t=>t&&t.name&&clubNames.set(nkey(t.name),t.name));Object.values(data.comps||{}).forEach(c=>c&&c.name&&compNames.set(nkey(c.name),c.name));
  const em={},cem={},left=[];
  const pickClub=base=>{const k=nkey(base);if(clubNames.has(k))return{name:clubNames.get(k)};let best=null,bs=0;clubNames.forEach(n=>{const s=nameScore(base,n);if(s>bs){bs=s;best=n}});if(best&&bs>=0.85)return{name:best};
    const t=matchTeam(base);return t?{team:t}:null};
  const pickComp=base=>{const k=nkey(base);if(compNames.has(k))return{name:compNames.get(k)};const c=matchComp(base);return c?{comp:c}:null};
  const addEm=async(blob,base,isComp)=>{const hit=isComp?pickComp(base):pickClub(base);if(!hit)return false;const nm=hit.name||(hit.team||hit.comp).name;
    const rec=await addImageFromBlob(blob,isComp?'comp':'emblem',nm+(isComp?' logo':' crest')+' (update file)');(isComp?cem:em)[nkey(nm)]={id:rec.id,obj:hit.team||hit.comp||null};return true};
  for(const it of imgs){const low=it.path.toLowerCase();if(/(kit|strip|manager|coach)/.test(low)){left.push(it);continue}
    const base=it.path.split('/').pop();const isComp=/(competition|league|cup|tournament)s?\//.test(low);
    try{if(!await addEm(it.blob,base,isComp)&&!(isComp?false:await addEm(it.blob,base,true)))left.push(it)}catch(e){left.push(it)}}
  // links instead of files: try to fetch them; list the ones the browser can't reach
  const links=[...Object.entries((data.assets||{}).emblems||{}).map(([n,u])=>[n,u,false]),...Object.entries((data.assets||{}).compEmblems||{}).map(([n,u])=>[n,u,true])].filter(([n,u])=>/^https?:\/\//.test(String(u)));
  const failed=[];for(const grp of chunk(links,4))await Promise.all(grp.map(async([n,u,isComp])=>{const nm=(data.teams&&data.teams[n]&&data.teams[n].name)||(data.comps&&data.comps[n]&&data.comps[n].name)||n;
    if((isComp?cem:em)[nkey(nm)])return;try{const b=await fetchImage(u);if(!await addEm(b,nm,isComp))failed.push([nm,u])}catch(e){failed.push([nm,u])}}));
  if(failed.length){data.notes.push(`${failed.length} crest links couldn't be downloaded by the browser. Open each link, save the image, and drop the images on Import files:`);failed.forEach(([n,u])=>data.notes.push(n+': '+u))}
  data.__em=em;data.__cem=cem;await importStudioFile({name:fname},null,data);return{left}}
// attach crests to the clubs and competitions in the update, or to clubs already in the project
const _mergeIncoming=mergeIncoming;
mergeIncoming=function(data){const m=_mergeIncoming(data);const em=data.__em||{},cem=data.__cem||{};
  Object.values(m.teams).forEach(t=>{const e=em[nkey(t.name)];if(e){t.emblem=e.id;e.used=true}});
  Object.values(m.comps).forEach(c=>{const e=cem[nkey(c.name)];if(e){c.emblem=e.id;e.used=true}});
  Object.values(em).forEach(e=>{if(!e.used&&e.obj&&S.teams[e.obj.id]){const t=clone(S.teams[e.obj.id]);t.emblem=e.id;m.teams[t.id]=t}});
  Object.values(cem).forEach(e=>{if(!e.used&&e.obj&&S.comps[e.obj.id]){const c=clone(S.comps[e.obj.id]);c.emblem=e.id;m.comps[c.id]=c}});
  return m};
