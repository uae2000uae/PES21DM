/* ================= v4: move the whole project between copies (claude.ai ⇄ local / cloud) ================= */
// snapshots are left out on purpose: only the current data, images, team-file templates, review queue, jobs and history move
const XFER_COLS=['teams','comps','images','settings','pending','teds','jobs','history'];
const XFER_FILE='project-transfer.zip';
function xferDocs(){const d={teams:Object.values(S.teams),comps:Object.values(S.comps),images:Object.values(S.images),pending:Object.values(S.pending),
  teds:Object.values(S.teds||{}),jobs:Object.values(S.jobs||{}).filter(j=>j.status!=='done'),history:Object.values(S.history||{})};

ACT.xferExport=async()=>{if(typeof JSZip==='undefined'){toast('ZIP library not loaded','err');return}
  try{if(typeof histFlush==='function')await histFlush()}catch(e){}
  const docs=xferDocs();const refs=[...new Set([...docs.images.map(i=>i.ref),...docs.teds.map(t=>t.ref)].filter(Boolean))];
  const z=new JSZip();const files={};let miss=0;const signal=startAI(refs.length+1);S.ui.ai.label='Collecting images…';
  try{let done=0;for(const grp of chunk(refs,6)){if(signal.aborted)throw new Error('Stopped');await Promise.all(grp.map(async ref=>{try{const b=await Store.getBlob(ref);if(!b){miss++;return}
        const ext=/svg/.test(b.type)?'svg':/jpe?g/.test(b.type)?'jpg':/webp/.test(b.type)?'webp':/png/.test(b.type)?'png':'bin';const name='blobs/'+ref.replace(/[^a-z0-9]/gi,'_')+'.'+ext;
        z.file(name,b);files[ref]={file:name,type:b.type||'application/octet-stream'}}catch(e){miss++}}));done+=grp.length;S.ui.ai.label='Collecting files '+done+' of '+refs.length;progStep()}
    z.file('project.json',JSON.stringify({app:'pes21-option-studio',kind:'full-transfer',version:1,exportedAt:Date.now(),season:S.settings.season,counts:{teams:docs.teams.length,players:allPlayers().length,images:docs.images.length},collections:docs,files}));
    S.ui.ai.label='Packing the ZIP…';const blob=await z.generateAsync({type:'blob',compression:'STORE'});progStep();
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(!dl)throw new Error('Downloads are not available in this view');
    await dl.save({filename:XFER_FILE,data:blob});toast(`Project packed: ${docs.teams.length} teams, ${docs.images.length} images${miss?`, ${miss} files missing`:''} (${kb(blob.size)})`,'ok')}
  catch(e){toast('Could not pack the project: '+e.message,'err')}finally{endAI()}};
async function xferImport(blob,{confirm=true}={}){const z=await JSZip.loadAsync(blob);const pj=z.file('project.json');if(!pj)throw new Error('This ZIP is not a project transfer');
  const P=JSON.parse(await pj.async('string'));if(P.kind!=='full-transfer')throw new Error('This ZIP is not a project transfer');const C=P.collections||{};
  const have=teamsArr().length;
  if(confirm&&!await ask('Load whole project',`Load <b>${(C.teams||[]).length} teams</b>, ${(C.images||[]).length} images and the review queue from this file?${have?` This <b>replaces</b> your ${have} current teams (a snapshot is taken first).`:''}`,'Load project',!!have))return false;
  if(have)await takeSnapshot('Before loading a project transfer',true);
  await miniBusy('Loading the project…',async()=>{
    const map={};const ents=Object.entries(P.files||{});let i=0;
    for(const grp of chunk(ents,8)){await Promise.all(grp.map(async([ref,f])=>{const zf=z.file(f.file);if(!zf)return;const b=new Blob([await zf.async('arraybuffer')],{type:f.type});map[ref]=await Store.putBlob(b,/^image\//.test(f.type)?f.type:'text/plain')}));i+=grp.length;S.ui.ai.busy='Loading files '+i+' of '+ents.length;progRender()}
    const fixRef=o=>{if(o&&o.ref&&map[o.ref])o.ref=map[o.ref];return o};
    // clear what is there, then write the incoming documents with their original ids
    for(const col of XFER_COLS){const cur=col==='settings'?[]:Object.keys(S[col]||{});cur.forEach(id=>Store.del(col,id));if(col!=='settings')S[col]={}}
    (C.images||[]).forEach(d=>{fixRef(d);S.images[d.id]=d;Store.put('images',d)});(C.teds||[]).forEach(d=>{fixRef(d);S.teds[d.id]=d;Store.put('teds',d)});
    (C.teams||[]).forEach(d=>{S.teams[d.id]=d;Store.put('teams',d)});(C.comps||[]).forEach(d=>{S.comps[d.id]=d;Store.put('comps',d)});
    (C.pending||[]).forEach(d=>{S.pending[d.id]=d;Store.put('pending',d)});(C.jobs||[]).forEach(d=>{if(d.status==='running')d.status='queued';S.jobs[d.id]=d;Store.put('jobs',d)});
    (C.history||[]).forEach(d=>{S.history[d.id]=d;Store.put('history',d)});
    const st=(C.settings||[])[0];if(st){const keepBase=S.settings.baseline&&S.snaps[S.settings.baseline]?S.settings.baseline:null;S.settings=Object.assign(clone(DEFAULT_SETTINGS),st,{sizes:Object.assign(clone(DEFAULT_SETTINGS.sizes),st.sizes||{}),baseline:keepBase});saveSettings()}
    S._saved={};Object.values(S.teams).forEach(t=>S._saved[t.id]=clone(t));
    for(let k=0;k<600&&Store.pending()>0;k++){S.ui.ai.busy='Saving… '+Store.pending()+' left';progRender();await sleep(100)}});

async function flFix(b){if(!/svg/.test(b.type))return b; // draw SVGs at 1024 px so the PNG made from them is sharp
  let t=await b.text();const m=t.match(/<svg\b[^>]*>/i);if(!m)return b;let tag=m[0];
  const vb=tag.match(/viewBox=["']\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)/i);
  let w=vb?+vb[1]:+((tag.match(/\swidth=["']([\d.]+)/i)||[])[1]||1),h=vb?+vb[2]:+((tag.match(/\sheight=["']([\d.]+)/i)||[])[1]||1);
  const k=1024/Math.max(w,h,1);let nt=tag.replace(/\s(width|height)=["'][^"']*["']/gi,'').replace(/<svg\b/i,`<svg width="${Math.round(w*k)}" height="${Math.round(h*k)}"`);
  if(!vb&&w>1&&h>1)nt=nt.replace(/<svg\b/i,`<svg viewBox="0 0 ${w} ${h}"`);if(!/xmlns=/.test(nt))nt=nt.replace(/<svg\b/i,'<svg xmlns="http://www.w3.org/2000/svg"');
  return new Blob([t.replace(tag,nt)],{type:'image/svg+xml'})}

  const r=await fetch('api/logo/find?'+q,{signal});const o=await r.json().catch(()=>({}));if(!r.ok)throw new Error(o.error||('logo search failed ('+r.status+')'));return o}

  catch(e){if(e.name==='AbortError')throw e;aiLog('  Logo for '+obj.name+' failed: '+e.message);return null}}

async function flAskSlugs(items,signal){const s=await getSample();if(!s||!items.length)return{};
  const prompt=`For each football club or competition below, give the most likely slugs on footylogos.com: the part after https://www.footylogos.com/logos/ in the club's page address, e.g. "al-ain", "real-madrid", "fc-barcelona"; for competitions the logo slug, e.g. "premier-league-england". Lowercase with hyphens, up to 3 guesses each, best first.

  try{const r=await s(prompt,{modelTier:'quick',signal});const o=parseLoose(r.text);return(o&&o.slugs)||{}}catch(e){if(e.name==='AbortError')throw e;aiLog('  Claude could not suggest slugs: '+e.message);return{}}}

async function runLogoJob(j,signal){
  const teams=(j.teamIds||[]).map(id=>S.teams[id]).filter(Boolean),comps=(j.compIds||[]).map(id=>S.comps[id]).filter(Boolean);
  const all=[...comps.map(o=>({src:o,o:{id:o.id,name:o.name,country:o.country},kind:'comp'})),...teams.map(o=>({src:o,o:{id:o.id,name:o.name,country:o.country},kind:'emblem'}))];

  queueAdd(jobs);toast('Queued '+jobs.length+' logo job'+(jobs.length>1?'s':'')+' for '+ts.length+' clubs and '+cs.length+' competitions. Progress shows on Claude update; results go to Review changes.','ok')};
ACT.flRun=()=>flDialog();
function flBar(){if(!flAvailable())return'';return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
  <div class="small">Latest club crests and competition logos from <a href="${FL_SITE}" target="_blank" rel="noopener">FootyLogos</a> (1500 px PNG). Choose clubs, competitions and countries; only the logos change, and they go to <a href="#review">Review changes</a> first.</div>
  <button class="sm primary" data-act="flRun">Get logos from FootyLogos…</button></div></div>`}

/* ================= Boot ================= */
(async function boot(){
  const mode=await Store.init();status();
  try{
    const [teams,comps,images,snaps,pending,settings,teds,jobs,history]=await Promise.all(['teams','comps','images','snaps','pending','settings','teds','jobs','history'].map(c=>Store.list(c).catch(e=>{S._loadFailed=true;console.warn('load '+c,e);return []})));teds.forEach(x=>S.teds[x.id]=x);jobs.forEach(x=>S.jobs[x.id]=x);history.forEach(x=>S.history[x.id]=x);
    teams.forEach(t=>{t.players=(t.players||[]).map(p=>normPlayer(Object.assign(newPlayer(),p,{attrs:Object.assign(newPlayer({pos:p.pos}).attrs,p.attrs||{})})));S.teams[t.id]=t});
    comps.forEach(c=>S.comps[c.id]=c);images.forEach(i=>S.images[i.id]=i);snaps.forEach(s=>S.snaps[s.id]=s);pending.forEach(b=>S.pending[b.id]=b);
    const st=settings.find(x=>x.id==='main');if(st)S.settings=Object.assign(clone(DEFAULT_SETTINGS),st,{sizes:Object.assign(clone(DEFAULT_SETTINGS.sizes),st.sizes||{})});
    if(mode==='local')await Promise.all(images.map(i=>Store.preload(i.ref)));
    await extBoot();
  }catch(e){toast('Could not load your project: '+e.message,'err')}
  if(mode==='memory')toast('Storage is unavailable in this view. Export a backup before closing.','err');
  status();route();
})();
</script>
